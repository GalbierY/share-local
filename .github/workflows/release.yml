name: Publicar atualização
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Conferir versão e destino
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne "v$($pkg.version)") { throw 'A tag precisa corresponder à versão do package.json.' }
          $target = $pkg.build.publish | Select-Object -First 1
          if (-not $target -or "$($target.owner)/$($target.repo)" -ne $env:GITHUB_REPOSITORY) { throw 'Configure o repositório com npm run updates:setup -- URL antes de publicar.' }
      - run: npm test
      - name: Gerar instalador
        run: npm run dist
      - name: Publicar uma única release com todos os arquivos
        shell: pwsh
        run: |
          $artifacts = @((Get-ChildItem release -Filter *.exe).FullName)
          $artifacts += @((Get-ChildItem release -Filter *.blockmap).FullName)
          $artifacts += (Resolve-Path release/latest.yml).Path
          gh release create $env:GITHUB_REF_NAME @artifacts --title "Share Local $env:GITHUB_REF_NAME" --generate-notes --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'A publicação da release falhou.' }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
